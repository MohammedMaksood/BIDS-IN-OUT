<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BIDS IN & OUT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e2024, #23272b);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .brand {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        .register-container {
            background: rgba(45, 45, 45, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: fadeIn 0.5s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }

        .form-group:nth-child(1) { animation-delay: 0.2s; }
        .form-group:nth-child(2) { animation-delay: 0.3s; }
        .form-group:nth-child(3) { animation-delay: 0.4s; }

        .form-group input {
            width: 100%;
            padding: 12px 35px 12px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(255, 107, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.2);
        }

        .form-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: color 0.3s ease;
            font-size: 16px;
            z-index: 2;
        }

        .form-group i.toggle-password {
            right: 12px;
            font-size: 18px;
        }

        .form-group i:hover {
            color: rgba(255, 107, 0, 0.8);
        }

        .password-requirements {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 5px;
            text-align: left;
            padding-left: 5px;
        }

        .password-requirements.valid {
            color: #2ecc71;
        }

        .password-requirements.invalid {
            color: #ff6b6b;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 107, 0, 0.8);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .login-btn:hover {
            background: rgba(255, 107, 0, 1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.3);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .register-link a {
            color: rgba(255, 107, 0, 0.8);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: rgba(255, 107, 0, 1);
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(10px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Add style for success message */
        .success-message {
            color: #2ecc71;
            text-align: center;
            margin-top: 10px;
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="brand">BIDS IN & OUT</div>

    <div class="register-container">
        <div class="login-header">
            <h2>Registration</h2>
        </div>

        <form id="registerForm" class="register-form">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
                <i class="fas fa-user"></i>
            </div>

            <div class="form-group">
                <input type="email" id="email" placeholder="Email" required>
                <i class="fas fa-envelope"></i>
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required minlength="8">
                <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility()"></i>
                <div class="password-requirements" id="passwordRequirements">
                    Password must be at least 8 characters
                </div>
            </div>

            <button type="submit" class="login-btn">Register</button>
        </form>

        <div class="register-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
        <div id="message"></div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }

        // Password validation
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const requirements = document.getElementById('passwordRequirements');
            
            if (password.length >= 8) {
                requirements.classList.add('valid');
                requirements.classList.remove('invalid');
            } else {
                requirements.classList.add('invalid');
                requirements.classList.remove('valid');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            // Password validation
            if (password.length < 8) {
                messageDiv.textContent = 'Password must be at least 8 characters long';
                messageDiv.style.color = '#ff6b6b';
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        username: username,
                        email: email,
                        password: password 
                    })
                });

                const data = await response.json();
                console.log('Server response:', data);

                if (response.ok) {
                    messageDiv.textContent = 'Registration successful! Please login.';
                    messageDiv.style.color = '#2ecc71';
                    
                    // Store username for login page
                    sessionStorage.setItem('registeredUser', username);
                    
                    // Clear the form
                    document.getElementById('registerForm').reset();
                    
                    // Redirect to login page after 1 second
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
                } else {
                    messageDiv.textContent = data.message || 'Registration failed';
                    messageDiv.style.color = '#ff6b6b';
                }
            } catch (error) {
                console.error('Registration error:', error);
                messageDiv.textContent = 'Registration failed. Please try again.';
                messageDiv.style.color = '#ff6b6b';
            }
        });
    </script>
</body>
</html>
